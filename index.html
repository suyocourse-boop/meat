<style>
:root{--bg:#fff;--ink:#222;--accent:#b00;--soft:#eee;--head:"Unbounded","Arial Black",Impact,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--head);line-height:1.15;font-weight:700}
.btn{display:inline-block;padding:15px 28px;border-radius:999px;font-weight:700;text-decoration:none;font-size:1rem;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--accent);color:var(--bg)}
.btn-line{border:2px solid var(--ink);margin-left:8px}
@media(max-width:520px){.btn-line{margin:10px 0 0}}

header{padding:20px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--head);font-weight:700;font-size:1.05rem;text-decoration:none}
.top-call{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.92rem}

.hero{padding:30px 0 70px}
.hero .wrap{display:grid;gap:40px;align-items:center}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2.2rem,7vw,4rem);margin-bottom:20px}
.hero p{max-width:46ch;font-size:1.1rem;margin-bottom:28px;opacity:.85}
.perks{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;list-style:none}
.perks li{background:var(--soft);padding:7px 15px;border-radius:999px;font-size:.92rem;font-weight:500}
.arch{position:relative;width:100%;max-width:380px;aspect-ratio:4/5;justify-self:center;border-radius:999px 999px 26px 26px;background:var(--accent);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:7.5rem;box-shadow:14px 14px 0 var(--soft)}
.arch img,.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

section{padding:64px 0}
h2{font-size:clamp(1.6rem,4.5vw,2.3rem);margin-bottom:10px}
.sub{opacity:.75;margin-bottom:34px;max-width:54ch}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--soft);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:4.2rem;background:color-mix(in srgb,var(--accent) 14%,var(--soft))}
.card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.05rem}
.card p{font-size:.95rem;opacity:.8;flex:1}
.price{font-family:var(--head);font-weight:700;color:var(--accent);font-size:1.1rem;margin-top:6px}
.price small{font-family:var(--body);font-weight:500;color:var(--ink);opacity:.7;font-size:.82rem}

.steps{background:var(--ink);color:var(--bg)}
.steps .sub{opacity:.8}
.steplist{display:grid;gap:22px;list-style:none;counter-reset:s}
@media(min-width:760px){.steplist{grid-template-columns:repeat(3,1fr)}}
.steplist li{counter-increment:s;padding-top:16px;border-top:2px solid var(--accent)}
.steplist li::before{content:counter(s);font-family:var(--head);font-size:2rem;color:var(--accent);display:block}
.steplist b{display:block;font-size:1.1rem;margin:4px 0}
.steplist span{opacity:.8;font-size:.95rem}

.about p{max-width:60ch;margin-bottom:12px;opacity:.88}

.loc{background:var(--soft)}
.locgrid{display:grid;gap:26px}
@media(min-width:820px){.locgrid{grid-template-columns:.8fr 1.2fr}}
.info h3{font-size:1rem;margin:0 0 6px}
.info p{margin-bottom:16px}
.bigphone{font-family:var(--head);font-size:1.6rem;text-decoration:none;color:var(--accent);display:block;margin-bottom:16px}
.hours{width:100%;border-collapse:collapse;margin-bottom:16px}
.hours td{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1)}
.hours td:last-child{text-align:right;font-weight:700}
.map{border-radius:22px;overflow:hidden;min-height:340px;background:#ddd}
.map iframe{width:100%;height:100%;min-height:340px;border:0;display:block}

footer{padding:28px 0 40px;font-size:.88rem;opacity:.7;text-align:center}
.sticky{position:fixed;left:14px;right:14px;bottom:14px;z-index:20;text-align:center;background:var(--accent);color:var(--bg);padding:15px;border-radius:999px;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.3)}
@media(min-width:720px){.sticky{display:none}}
@media(max-width:719px){footer{padding-bottom:96px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

/* ===== ХЭВ МАЯГУУД (STYLE) ===== */
body.s-circle .arch{border-radius:50%;aspect-ratio:1/1;box-shadow:none;outline:3px solid var(--accent);outline-offset:10px}
body.s-soft{--head:"Manrope",system-ui,sans-serif}
body.s-soft h1,body.s-soft h2,body.s-soft h3{font-weight:800}
body.s-soft .arch{border-radius:40px;aspect-ratio:1/1;box-shadow:none}
body.s-soft .card,body.s-soft .map{border-radius:30px}
body.s-sharp{--head:"Cormorant Garamond",Georgia,serif}
body.s-sharp h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:600}
body.s-sharp h2{font-weight:600}
body.s-sharp .btn,body.s-sharp .top-call,body.s-sharp .sticky,body.s-sharp .perks li{border-radius:0}
body.s-sharp .card,body.s-sharp .map{border-radius:0}
body.s-sharp .arch{border-radius:0;box-shadow:none;outline:1px solid var(--accent);outline-offset:14px}
body.s-sharp .price{font-weight:600;font-size:1.35rem}
body.s-bold{--head:"Unbounded","Arial Black",sans-serif}
body.s-bold .btn,body.s-bold .card,body.s-bold .map,body.s-bold .arch{border:3px solid var(--ink)}
body.s-bold .card,body.s-bold .map{border-radius:14px;box-shadow:6px 6px 0 var(--ink)}
body.s-bold .arch{border-radius:24px;box-shadow:10px 10px 0 var(--ink)}
body.s-bold .btn{border-radius:12px}

/* Захиалгын хэсэг */
.cbtn{display:inline-block;margin-top:10px;align-self:flex-start;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;text-decoration:none}
.cbtn:hover{background:var(--accent)}
.order{background:var(--soft)}
.formbox{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.formbox iframe{width:100%;height:760px;border:0;display:block}
.formnote{margin-top:14px;font-size:.92rem;opacity:.8}
body.s-sharp .cbtn,body.s-sharp .formbox{border-radius:0}
body.s-bold .cbtn{border-radius:12px}
body.s-bold .formbox{border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink)}
</style>
